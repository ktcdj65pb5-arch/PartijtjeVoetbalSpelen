<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veldreservering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --yellow:#F3D02B;
    --yellow-deep:#E5BE12;
    --black:#141210;
    --paper:#FFFFFF;
    --ink:#1A1712;
    --ink-soft:#5C5646;
    --accent:#F3D02B;
    --line:#E3D68A;
    --danger:#B4432E;
    --danger-bg:#FBEAE5;
    --ok:#1F6B3B;
    --ok-bg:#E7F1EA;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--yellow);
    color:var(--ink);
    font-family:"Inter", "Segoe UI", Arial, sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:clamp(28px, 8vw, 80px);}

  header.hero{
    background:var(--yellow);
    color:var(--black);
    padding:34px clamp(28px, 8vw, 80px) 26px;
    position:relative;
  }
  .hero-inner{max-width:1040px;margin:0 auto;position:relative;z-index:1;}
  .club-name{
    font-family:"Inter", sans-serif;
    font-weight:700;
    letter-spacing:1px;
    font-size:14px;
    margin:0 0 14px;
  }
  .hero-inner h1{
    font-family:"Anton", "Arial Narrow", Arial, sans-serif;
    font-weight:400;
    font-size:38px;
    line-height:0.98;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--black);
    color:var(--yellow);
    display:inline-block;
    padding:10px 16px;
    margin:0 0 10px;
  }
  .hero-inner .accent-line{
    font-family:"Caveat", cursive;
    font-size:24px;
    font-weight:600;
    margin:0 0 16px;
    transform:rotate(-1.5deg);
  }
  .hero-inner p{
    margin:0;
    color:var(--ink);
    font-size:15px;
    max-width:520px;
  }
  .hero-inner p b{color:var(--black);}

  nav.tabs{
    display:flex;
    gap:8px;
    margin-top:24px;
  }
  nav.tabs button{
    background:transparent;
    border:1.5px solid var(--black);
    color:var(--black);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:"Inter", sans-serif;
  }
  nav.tabs button.active{
    background:var(--black);
    color:var(--yellow);
    border-color:var(--black);
  }

  main{
    background:var(--paper);
    border-radius:16px;
    padding:32px clamp(20px, 4vw, 40px) 40px;
  }

  .datecards{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px,1fr));
    gap:14px;
    margin-bottom:30px;
  }
  .datecard{
    background:var(--paper);
    border:2px solid var(--black);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    transition:background 0.15s;
  }
  .datecard:hover{background:#FFFBEB;}
  .datecard.selected{
    background:var(--black);
    color:var(--yellow);
  }
  .datecard.selected .full-date{color:#D9CFA6;}
  .datecard .day{
    font-family:"Anton", Arial, sans-serif;
    font-weight:400;
    font-size:22px;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .datecard .full-date{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .slotrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    padding:6px 0;
    border-top:1px dashed var(--line);
  }
  .datecard.selected .slotrow{border-top:1px dashed #4A4633;}
  .datecard.selected .slot-label{color:#D9CFA6;}
  .slotrow:first-of-type{border-top:1px dashed var(--line);}
  .slot-label{color:var(--ink-soft);}
  .slot-count{
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    background:var(--ok-bg);
    color:var(--ok);
  }
  .slot-count.empty{
    background:var(--danger-bg);
    color:var(--danger);
  }

  .card{
    background:var(--paper);
    border:2px solid var(--black);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:"Anton", Arial, sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:20px;
    margin:0 0 16px;
  }

  .fieldtypes{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .fieldtype{
    flex:1;
    min-width:160px;
    border:2px solid var(--black);
    border-radius:var(--radius);
    padding:14px;
    cursor:pointer;
    position:relative;
  }
  .fieldtype.selected{background:var(--yellow);}
  .fieldtype.disabled{opacity:0.4;cursor:not-allowed;}
  .fieldtype .ft-title{font-weight:700;font-size:14px;margin-bottom:2px;}
  .fieldtype .ft-sub{font-size:12px;color:var(--ink-soft);}
  .fieldtype .ft-price{
    position:absolute;
    top:10px; right:12px;
    font-family:"Anton", Arial, sans-serif;
    font-size:18px;
  }

  label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin:14px 0 5px;
    font-weight:600;
  }
  input, textarea{
    width:100%;
    padding:9px 11px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:var(--paper);
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--black);
  }
  textarea{resize:vertical;min-height:60px;}

  .err{
    color:var(--danger);
    font-size:12.5px;
    margin-top:5px;
  }

  .btn{
    display:inline-block;
    background:var(--black);
    color:var(--yellow);
    border:none;
    padding:11px 22px;
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.3px;
    cursor:pointer;
    margin-top:20px;
    font-family:"Inter", sans-serif;
  }
  .btn:hover{background:#332E24;}
  .btn.secondary{
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
    padding:6px 12px;
    font-size:12.5px;
    margin-top:0;
    text-transform:none;
    font-weight:600;
  }
  .btn.small{
    padding:6px 14px;
    font-size:13px;
    margin-top:0;
  }

  .confirm{
    background:var(--black);
    color:var(--yellow);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:20px;
    font-size:14px;
  }
  .confirm b{
    display:block;
    font-family:"Anton", Arial, sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:17px;
    margin-bottom:4px;
  }

  .admin-date{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .admin-date .row{
    display:grid;
    grid-template-columns:1fr 1fr 100px 100px;
    gap:10px;
    align-items:end;
  }
  .admin-date .row label{margin-top:0;}
  table.res{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
  table.res th{
    text-align:left;
    color:var(--ink-soft);
    font-weight:600;
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  table.res td{
    padding:8px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  .empty-msg{color:var(--ink-soft);font-size:13px;padding:8px 0;}
  .muted{color:var(--ink-soft);font-size:12.5px;}
  .danger-zone{
    border-top:1px dashed var(--line);
    margin-top:24px;
    padding-top:18px;
  }
  .admin-topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="club-name">S.V. WISSEL</p>
    <h1>Partijtje<br>voetbal spelen</h1>
    <p class="accent-line">Zie ik jou daar?</p>
    <p>Kies een datum en boek een half of een kwart veld voor jullie partijtje. <b>Ongedwongen plezier</b>, zonder lidmaatschap.</p>
    <nav class="tabs">
      <button id="tab-public" class="active">Inschrijven</button>
      <button id="tab-admin">Beheer</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <main>

    <section id="view-public">
      <div id="public-loading" class="muted" style="padding:30px 0;">Beschikbaarheid laden…</div>
      <div id="public-content" style="display:none;"></div>
    </section>

    <section id="view-admin" style="display:none;">
      <div id="admin-loading" class="muted" style="padding:30px 0;">Gegevens laden…</div>
      <div id="admin-content" style="display:none;"></div>
    </section>

  </main>
</div>

<script>
const SUPABASE_URL = "https://iafvdzctjkpnhfckiefv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1u7uikeKm9Na9gnlGE9xjw_MjM5EDC9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let dates = [];
let prices = { half: 25, kwart: 15 };
let bezetting = {};
let session = null;

const TIJDSBLOKKEN = [
  { id: "10-11", label: "10:00\u201311:00" },
  { id: "11-12", label: "11:00\u201312:00" }
];
const GOALTJES = ["1x1 meter", "1x3 meter", "2x5 meter"];
const UNIT_COST = { half: 2, kwart: 1 };

function bezKey(speeldagId, tijdsblok){ return speeldagId + "|" + tijdsblok; }

function remainingUnits(dateObj, tijdsblok){
  const bezet = bezetting[bezKey(dateObj.id, tijdsblok)] || 0;
  return dateObj.units - bezet;
}
function remainingUnitsDayTotal(dateObj){
  return TIJDSBLOKKEN.reduce((sum, t) => sum + remainingUnits(dateObj, t.id), 0);
}
function canBook(dateObj, tijdsblok, type){
  return remainingUnits(dateObj, tijdsblok) >= UNIT_COST[type];
}

function fmtDate(iso){
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("nl-NL", { weekday:"long", day:"numeric", month:"long" });
}
function fmtDateShort(iso){
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("nl-NL", { weekday:"short" });
}
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function loadPublicData(){
  const [datesRes, pricesRes, bezRes] = await Promise.all([
    sb.from("speeldagen").select("*").order("datum"),
    sb.from("prijzen").select("*"),
    sb.from("bezetting").select("*")
  ]);
  if(datesRes.error) throw datesRes.error;
  if(pricesRes.error) throw pricesRes.error;
  if(bezRes.error) throw bezRes.error;

  dates = datesRes.data.map(d => ({ id: d.id, date: d.datum, units: d.eenheden_per_tijdsblok }));
  const p = {};
  pricesRes.data.forEach(row => { p[row.veldtype] = Number(row.bedrag); });
  prices = p;
  const b = {};
  bezRes.data.forEach(row => { b[bezKey(row.speeldag_id, row.tijdsblok)] = row.eenheden_bezet; });
  bezetting = b;
}

let selectedDateId = null;
let selectedTijdsblok = null;
let selectedType = null;

function renderPublic(){
  const el = document.getElementById("public-content");

  let cardsHtml = dates.map(d => {
    const dayLeft = remainingUnitsDayTotal(d);
    const dayTotal = d.units * TIJDSBLOKKEN.length;
    const sel = d.id === selectedDateId ? "selected" : "";
    return `
      <div class="datecard ${sel}" data-date-id="${d.id}">
        <div class="day">${fmtDateShort(d.date)}</div>
        <div class="full-date">${fmtDate(d.date)}</div>
        <div class="slotrow">
          <span class="slot-label">Beschikbaar deze dag</span>
          <span class="slot-count ${dayLeft<=0?'empty':''}">${dayLeft<=0 ? 'vol' : dayLeft + '/' + dayTotal + ' kwart-plekken'}</span>
        </div>
      </div>
    `;
  }).join("");

  let tijdsblokHtml = "";
  let fieldtypeHtml = "";

  if(selectedDateId){
    const d = dates.find(x => x.id === selectedDateId);

    tijdsblokHtml = `
      <div class="card">
        <h2>Kies het tijdsblok — ${fmtDate(d.date)}</h2>
        <div class="fieldtypes">
          ${TIJDSBLOKKEN.map(t => {
            const left = remainingUnits(d, t.id);
            const sel = selectedTijdsblok === t.id ? "selected" : "";
            const dis = left > 0 ? "" : "disabled";
            return `
              <div class="fieldtype ${sel} ${dis}" data-tijdsblok="${t.id}">
                <div class="ft-title">${t.label}</div>
                <div class="ft-sub">${left > 0 ? left + " van de " + d.units + " kwart-plekken vrij" : "Volgeboekt"}</div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;

    if(selectedTijdsblok){
      const left = remainingUnits(d, selectedTijdsblok);
      const halfOk = canBook(d, selectedTijdsblok, "half");
      const kwartOk = canBook(d, selectedTijdsblok, "kwart");
      fieldtypeHtml = `
        <div class="card">
          <h2>Kies het veld</h2>
          <p class="muted" style="margin:-8px 0 16px;">Er is 1 veld, in te delen als 4 kwart-plekken. Een half veld gebruikt er 2. Nu nog ${left} van de ${d.units} vrij.</p>
          <div class="fieldtypes">
            <div class="fieldtype ${selectedType==='half'?'selected':''} ${halfOk?'':'disabled'}" data-type="half">
              <div class="ft-price">&euro;${prices.half}</div>
              <div class="ft-title">Half veld</div>
              <div class="ft-sub">${halfOk ? 'Beschikbaar' : 'Niet genoeg ruimte meer'}</div>
            </div>
            <div class="fieldtype ${selectedType==='kwart'?'selected':''} ${kwartOk?'':'disabled'}" data-type="kwart">
              <div class="ft-price">&euro;${prices.kwart}</div>
              <div class="ft-title">Kwart veld</div>
              <div class="ft-sub">${kwartOk ? 'Beschikbaar' : 'Volgeboekt'}</div>
            </div>
          </div>

          <div id="reg-form" style="${selectedType ? '' : 'display:none;'}">
            <label for="f-naam">Naam</label>
            <input id="f-naam" type="text" placeholder="Voor- en achternaam">
            <div class="err" id="err-naam" style="display:none;"></div>

            <label for="f-team">Teamnaam (optioneel)</label>
            <input id="f-team" type="text" placeholder="Bijv. FC De Buren">

            <label for="f-tel">Telefoonnummer</label>
            <input id="f-tel" type="tel" placeholder="06 12345678">
            <div class="err" id="err-tel" style="display:none;"></div>

            <label for="f-aantal">Aantal deelnemers</label>
            <input id="f-aantal" type="number" min="1" step="1" placeholder="Bijv. 10">
            <div class="err" id="err-aantal" style="display:none;"></div>

            <label for="f-email">E-mailadres (optioneel)</label>
            <input id="f-email" type="email" placeholder="naam@voorbeeld.nl">

            <label for="f-goal">Doeltjes</label>
            <select id="f-goal">
              ${GOALTJES.map(g => `<option value="${g}">${g}</option>`).join("")}
            </select>

            <label for="f-opm">Opmerking (optioneel)</label>
            <textarea id="f-opm" placeholder="Bijv. verwachte aankomsttijd"></textarea>

            <div class="err" id="err-submit" style="display:none;"></div>
            <button class="btn" id="submit-res">Plek reserveren</button>
          </div>
        </div>
      `;
    }
  }

  el.innerHTML = `
    <div id="confirm-box"></div>
    <div class="datecards">${cardsHtml}</div>
    ${tijdsblokHtml}
    ${fieldtypeHtml}
  `;

  el.querySelectorAll(".datecard").forEach(c => {
    c.addEventListener("click", () => {
      selectedDateId = c.getAttribute("data-date-id");
      selectedTijdsblok = null;
      selectedType = null;
      renderPublic();
    });
  });

  el.querySelectorAll("[data-tijdsblok]").forEach(c => {
    c.addEventListener("click", () => {
      if(c.classList.contains("disabled")) return;
      selectedTijdsblok = c.getAttribute("data-tijdsblok");
      selectedType = null;
      renderPublic();
    });
  });

  el.querySelectorAll("[data-type]").forEach(c => {
    c.addEventListener("click", () => {
      if(c.classList.contains("disabled")) return;
      selectedType = c.getAttribute("data-type");
      renderPublic();
    });
  });

  const submitBtn = document.getElementById("submit-res");
  if(submitBtn){
    submitBtn.addEventListener("click", handleSubmit);
  }
}

async function handleSubmit(){
  const naamEl = document.getElementById("f-naam");
  const telEl = document.getElementById("f-tel");
  const aantalEl = document.getElementById("f-aantal");
  const errNaam = document.getElementById("err-naam");
  const errTel = document.getElementById("err-tel");
  const errAantal = document.getElementById("err-aantal");
  const errSubmit = document.getElementById("err-submit");

  let valid = true;
  if(!naamEl.value.trim()){
    errNaam.textContent = "Vul een naam in.";
    errNaam.style.display = "block";
    valid = false;
  } else {
    errNaam.style.display = "none";
  }
  if(!telEl.value.trim()){
    errTel.textContent = "Vul een telefoonnummer in.";
    errTel.style.display = "block";
    valid = false;
  } else {
    errTel.style.display = "none";
  }
  const aantal = parseInt(aantalEl.value, 10);
  if(!aantalEl.value.trim() || isNaN(aantal) || aantal < 1){
    errAantal.textContent = "Vul het aantal deelnemers in.";
    errAantal.style.display = "block";
    valid = false;
  } else {
    errAantal.style.display = "none";
  }
  if(!valid) return;

  errSubmit.style.display = "none";

  const d = dates.find(x => x.id === selectedDateId);
  if(!canBook(d, selectedTijdsblok, selectedType)){
    errSubmit.textContent = "Deze optie is helaas net volgeboekt. Kies een andere optie.";
    errSubmit.style.display = "block";
    await loadPublicData();
    renderPublic();
    return;
  }

  const tijdsblokLabel = TIJDSBLOKKEN.find(t => t.id === selectedTijdsblok).label;
  const naamWaarde = naamEl.value.trim();
  const veldType = selectedType;
  const datumIso = d.date;

  const submitBtn = document.getElementById("submit-res");
  submitBtn.disabled = true;

  const { error } = await sb.from("reserveringen").insert({
    speeldag_id: selectedDateId,
    tijdsblok: selectedTijdsblok,
    veldtype: veldType,
    naam: naamWaarde,
    team: document.getElementById("f-team").value.trim() || null,
    telefoon: telEl.value.trim(),
    aantal_deelnemers: aantal,
    email: document.getElementById("f-email").value.trim() || null,
    doeltje: document.getElementById("f-goal").value,
    opmerking: document.getElementById("f-opm").value.trim() || null
  });

  if(error){
    errSubmit.textContent = "Reserveren is niet gelukt: " + (error.message || "onbekende fout") + ". Probeer het opnieuw.";
    errSubmit.style.display = "block";
    submitBtn.disabled = false;
    await loadPublicData();
    renderPublic();
    return;
  }

  await loadPublicData();

  const veldLabel = veldType === "half" ? "half veld" : "kwart veld";
  selectedDateId = null;
  selectedTijdsblok = null;
  selectedType = null;
  renderPublic();
  document.getElementById("confirm-box").innerHTML = `
    <div class="confirm">
      <b>Gereserveerd</b>
      ${escapeHtml(naamWaarde)}, je hebt een ${veldLabel} op ${fmtDate(datumIso)} van ${tijdsblokLabel}. Tot dan!
    </div>
  `;
}

function renderLoginForm(){
  const el = document.getElementById("admin-content");
  el.innerHTML = `
    <div class="card" style="max-width:340px;">
      <h2>Inloggen</h2>
      <label for="login-email">E-mailadres</label>
      <input id="login-email" type="email" placeholder="naam@svwissel.nl">
      <label for="login-wachtwoord">Wachtwoord</label>
      <input id="login-wachtwoord" type="password" placeholder="••••••••">
      <div class="err" id="err-login" style="display:none;"></div>
      <button class="btn" id="login-submit">Inloggen</button>
    </div>
  `;
  const doLogin = async () => {
    const email = document.getElementById("login-email").value.trim();
    const wachtwoord = document.getElementById("login-wachtwoord").value;
    const err = document.getElementById("err-login");
    err.style.display = "none";
    const { data, error } = await sb.auth.signInWithPassword({ email, password: wachtwoord });
    if(error){
      err.textContent = "Inloggen mislukt: " + error.message;
      err.style.display = "block";
      return;
    }
    session = data.session;
    await renderAdmin();
  };
  document.getElementById("login-submit").addEventListener("click", doLogin);
  document.getElementById("login-wachtwoord").addEventListener("keydown", (e) => {
    if(e.key === "Enter") doLogin();
  });
}

async function renderAdmin(){
  const el = document.getElementById("admin-content");
  el.innerHTML = `<div class="muted" style="padding:20px 0;">Gegevens laden…</div>`;

  const { data: resData, error: resError } = await sb
    .from("reserveringen")
    .select("*")
    .order("created_at");

  if(resError){
    el.innerHTML = `<div class="card"><p class="err" style="display:block;">Kon reserveringen niet laden: ${escapeHtml(resError.message)}</p></div>`;
    return;
  }

  const datesHtml = dates.map(d => {
    const resForDate = resData.filter(r => r.speeldag_id === d.id);
    const rowsHtml = resForDate.length ? `
      <table class="res">
        <tr><th>Naam</th><th>Team</th><th>Tijd</th><th>Type</th><th>Aantal</th><th>Doeltje</th><th>Telefoon</th><th>E-mail</th><th></th></tr>
        ${resForDate.map(r => `
          <tr>
            <td>${escapeHtml(r.naam)}</td>
            <td>${escapeHtml(r.team || "—")}</td>
            <td>${(TIJDSBLOKKEN.find(t => t.id === r.tijdsblok) || {}).label || "—"}</td>
            <td>${r.veldtype === "half" ? "Half veld" : "Kwart veld"}</td>
            <td>${r.aantal_deelnemers || "—"}</td>
            <td>${escapeHtml(r.doeltje || "—")}</td>
            <td>${escapeHtml(r.telefoon)}</td>
            <td>${escapeHtml(r.email || "—")}</td>
            <td><button class="btn secondary" data-remove-res="${r.id}">Verwijderen</button></td>
          </tr>
        `).join("")}
      </table>
    ` : `<div class="empty-msg">Nog geen reserveringen voor deze datum.</div>`;

    return `
      <div class="admin-date" data-date-id="${d.id}">
        <div class="row" style="grid-template-columns:1fr 220px;">
          <div>
            <label>Datum</label>
            <input type="date" value="${d.date}" data-field="date">
          </div>
          <div>
            <label>Kwart-plekken per tijdsblok</label>
            <input type="number" min="0" max="4" value="${d.units}" data-field="units">
          </div>
        </div>
        ${rowsHtml}
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <div class="admin-topbar">
      <button class="btn secondary" id="logout-btn">Uitloggen</button>
    </div>
    <div class="card">
      <h2>Prijzen</h2>
      <div class="row" style="grid-template-columns:1fr 1fr;">
        <div>
          <label>Kwart veld (&euro;)</label>
          <input type="number" min="0" id="price-kwart" value="${prices.kwart}">
        </div>
        <div>
          <label>Half veld (&euro;)</label>
          <input type="number" min="0" id="price-half" value="${prices.half}">
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Data en capaciteit</h2>
      <p class="muted">Pas de drie speeldata aan en het aantal kwart-plekken per tijdsblok (standaard 4: het hele veld). Wijzigingen worden direct opgeslagen zodra je een veld verlaat.</p>
      ${datesHtml}
    </div>
    <div class="danger-zone">
      <button class="btn secondary" id="reset-all">Alle reserveringen wissen</button>
    </div>
  `;

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    session = null;
    renderLoginForm();
  });

  document.getElementById("price-kwart").addEventListener("change", async (e) => {
    const bedrag = Math.max(0, parseInt(e.target.value || "0", 10));
    await sb.from("prijzen").update({ bedrag }).eq("veldtype", "kwart");
    await loadPublicData();
  });
  document.getElementById("price-half").addEventListener("change", async (e) => {
    const bedrag = Math.max(0, parseInt(e.target.value || "0", 10));
    await sb.from("prijzen").update({ bedrag }).eq("veldtype", "half");
    await loadPublicData();
  });

  el.querySelectorAll("[data-field]").forEach(inp => {
    inp.addEventListener("change", async () => {
      const dateId = inp.closest(".admin-date").getAttribute("data-date-id");
      const field = inp.getAttribute("data-field");
      if(field === "date"){
        await sb.from("speeldagen").update({ datum: inp.value }).eq("id", dateId);
      } else {
        const val = Math.max(0, parseInt(inp.value || "0", 10));
        await sb.from("speeldagen").update({ eenheden_per_tijdsblok: val }).eq("id", dateId);
      }
      await loadPublicData();
      renderAdmin();
    });
  });

  el.querySelectorAll("[data-remove-res]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-remove-res");
      await sb.from("reserveringen").delete().eq("id", id);
      await loadPublicData();
      renderAdmin();
    });
  });

  document.getElementById("reset-all").addEventListener("click", async () => {
    if(!confirm("Weet je zeker dat je alle reserveringen wilt wissen? De speeldata en prijzen blijven staan.")) return;
    await sb.from("reserveringen").delete().neq("id", "00000000-0000-0000-0000-000000000000");
    await loadPublicData();
    renderAdmin();
  });
}

document.getElementById("tab-public").addEventListener("click", async () => {
  document.getElementById("tab-public").classList.add("active");
  document.getElementById("tab-admin").classList.remove("active");
  document.getElementById("view-public").style.display = "";
  document.getElementById("view-admin").style.display = "none";
  await loadPublicData();
  renderPublic();
});

document.getElementById("tab-admin").addEventListener("click", async () => {
  document.getElementById("tab-admin").classList.add("active");
  document.getElementById("tab-public").classList.remove("active");
  document.getElementById("view-admin").style.display = "";
  document.getElementById("view-public").style.display = "none";
  document.getElementById("admin-loading").style.display = "none";
  document.getElementById("admin-content").style.display = "";
  const { data: { session: currentSession } } = await sb.auth.getSession();
  session = currentSession;
  if(session){
    renderAdmin();
  } else {
    renderLoginForm();
  }
});

(async function init(){
  try{
    await loadPublicData();
    renderPublic();
  }catch(e){
    document.getElementById("public-loading").textContent = "Kon gegevens niet laden. Probeer de pagina te vernieuwen.";
  }
  document.getElementById("public-loading").style.display = "none";
  document.getElementById("public-content").style.display = "";
})();
</script>

</body>
</html>
